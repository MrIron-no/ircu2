# haproxy sidecar (container ircu-haproxy, 10.55.0.32) for the PROXY protocol
# integration tests. Every listen block below is exercised by
# tests/proxy_protocol/test_proxy_haproxy.py:
#   v1_plain           (7100) - PROXY v1 into the hub's plain proxy port 7003
#   v2_plain           (7101) - PROXY v2 into the hub's plain proxy port 7003
#   v2_ws              (7102) - PROXY v2 into the hub's websocket proxy port 7004
#   v2_tls_passthrough (7103) - PROXY v2 into the TLS hub's proxy port 6702
global
    log stdout format raw local0
    maxconn 256
defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 120s
    timeout server 120s
# 7100: PROXY v1 -> hub plain proxy port
listen v1_plain
    bind *:7100
    server hub 10.55.0.10:7003 send-proxy
# 7101: PROXY v2 -> hub plain proxy port
listen v2_plain
    bind *:7101
    server hub 10.55.0.10:7003 send-proxy-v2
# 7102: PROXY v2 -> hub websocket proxy port
listen v2_ws
    bind *:7102
    server hub 10.55.0.10:7004 send-proxy-v2
# 7103: PROXY v2 -> TLS hub, TLS passed through untouched
listen v2_tls_passthrough
    bind *:7103
    server tlshub 10.55.0.20:6702 send-proxy-v2
